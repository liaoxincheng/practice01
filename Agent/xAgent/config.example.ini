; xAgent 示例配置:复制本文件为 config.ini 后按需修改
; 注意:config.ini 已被 .gitignore 排除,含密钥的配置不会提交到仓库

[llm]
; 本地 LM Studio 的 OpenAI 兼容接口,也可换成其他兼容服务
base_url = http://127.0.0.1:1234/v1
model = qwen3.5-4b
; 本地模型不需要真实密钥,习惯上填 DUMMY 占位
api_key = DUMMY

[agent]
; 一轮对话中工具调用的最大来回数
max_tool_rounds = 5

[file_ops]
; 文件工具的工作目录:模型只能读写这个目录内的文件(安全沙箱)
work_dir = workspace

[cli_ops]
; RunCli 单次命令执行超时(秒)
timeout_seconds = 30
; stdout / stderr 各自的最大保留字符数(超出截断)
max_output_chars = 4000

[web_ops]
; fetchWeb 下载单个网页的超时(秒)
fetch_timeout_seconds = 20
; 网页正文 / 搜索结果的最大保留字符数(超出截断)
max_content_chars = 6000

[search]
; searchWeb 联网搜索 —— 百度千帆 AI 搜索 API
; 接口文档:https://cloud.baidu.com/doc/qianfan-api/s/Wmbq4z7e5
; 在百度智能云千帆平台申请 API Key 后填在下面(不带引号);
; 留空时 searchWeb 返回"未配置"提示,其余功能不受影响
baidu_qianfan_api_key =
; 每次搜索返回的参考来源条数上限
top_k = 10
; 搜索 API 请求超时(秒)
timeout_seconds = 20
