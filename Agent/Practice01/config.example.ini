; 配置模板:复制为 config.ini 并填写你自己的模型服务地址。
;
;    copy config.example.ini config.ini
;
; [llm] 段三个值必填:
;   base_url  OpenAI 兼容接口地址(本地 LM Studio / Ollama,或云端 API)
;   model     模型名(要和服务端已加载的模型一致)
;   api_key   密钥;本地服务可随便填一个非空值(如 DUMMY)
;
; 示例:LM Studio 本地服务(默认 127.0.0.1:1234)
[llm]
base_url = http://127.0.0.1:1234/v1
model = qwen3.5-4b
api_key = DUMMY
