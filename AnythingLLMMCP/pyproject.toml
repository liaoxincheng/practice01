[project]
name = "anythingllm-mcp"
version = "0.1.0"
description = "把 AnythingLLM 工作区的检索问答包装成 MCP 工具"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
anythingllm-mcp = "server:main"

[tool.setuptools]
py-modules = ["server", "anythingllm_api"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
